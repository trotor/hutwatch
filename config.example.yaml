# HutWatch configuration example
# Copy this file to config.yaml and fill in your values

# UI language: fi (Finnish, default) or en (English)
# Can also be set with --lang CLI flag
# language: fi

# Site name for this instance — shown to peers and the central hub when
# this instance POSTs its data via /api/v1/sync. Also set this on remote
# sites that don't have TUI access. If unset, the TUI's `p <name>` command
# (writes to DB) is used as fallback.
# site_name: "Haukijärvi"

# Sensors: list specific MACs, or use an empty list for pure auto-discovery.
# Discovery is always on — new sensors are found automatically even when
# some sensors are pre-configured below.
sensors: []

# To pre-configure specific sensors (new ones are still discovered automatically):
# sensors:
#   - mac: "AA:BB:CC:DD:EE:FF"
#     name: "Ruuvi1"
#     type: ruuvi
#   - mac: "11:22:33:44:55:66"
#     name: "Xiaomi1"
#     type: xiaomi

# Telegram bot (optional — install with: pip install hutwatch[telegram])
# Without Telegram, readings are printed to the console.
# telegram:
#   token: "your-telegram-bot-token"
#   chat_id: 123456789
#   report_interval: 3600

# Weather from yr.no (MET Norway API) — optional
# Find coordinates: https://www.latlong.net/
# weather:
#   latitude: 60.1699
#   longitude: 24.9384
#   location_name: "Helsinki"

# API server for remote site sharing (optional)
# Exposes sensor data as JSON on the given port.
# api_port: 8099

# Bind address for the API server (optional, default 0.0.0.0)
# Set to 127.0.0.1 when running behind nginx reverse proxy on the same host
# so the port isn't exposed to the network directly.
# api_bind: 127.0.0.1

# Shared token required in the X-HutWatch-Token header for POST /api/v1/sync.
# When set, unauthenticated sync requests get 401. Recommended whenever the
# API is reachable from the public internet (e.g. via nginx). Use the same
# value in peers[].token on the client side.
# api_token: "change-me-to-a-long-random-string"

# Peer watchdog (optional, central hub mode)
# Monitors when peers stop syncing — useful for detecting power/network outages.
# Sends a Telegram alert when a peer hasn't synced for threshold_seconds and
# another alert when it recovers. Set threshold_seconds: 0 to disable.
# peer_watchdog:
#   threshold_seconds: 900       # 15 minutes
#   check_interval_seconds: 60

# Bidirectional peer sync (optional, recommended)
# Sends your data to the peer and receives theirs — both sides see everything.
# The peer only needs api_port enabled, no peers: config needed on that end.
# Set token to match the peer's api_token if the peer requires authentication.
# peers:
#   - name: "Cabin"
#     url: "http://100.64.0.2:8099"
#     poll_interval: 30
#     # token: "must-match-peer-api_token"

# Read-only remote sites (optional, legacy)
# One-way monitoring: fetches data but doesn't share yours.
# remote_sites:
#   - name: "Cabin"
#     url: "http://100.64.0.2:8099"
#     poll_interval: 30
#     # token: "must-match-remote-api_token"
